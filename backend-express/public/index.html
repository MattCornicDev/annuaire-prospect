<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Cabinets dentaires du 59</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <div class="container">

    <div class="header">
      <div class="title-block">
        <h1>Cabinets dentaires du 59</h1>
        <p>Annuaire enrichi (site, email, téléphone) pour prospection ciblée.</p>
      </div>

      <div class="filters">
        <label for="ville">Ville :</label>
        <select id="ville">
          <option value="">Toutes les villes</option>
        </select>
      </div>
    </div>

    <div class="card">
      <p id="loading">Chargement des données...</p>

      <table id="table" style="display:none;">
        <thead>
          <tr>
            <th>Nom</th>
            <th>Adresse</th>
            <th>Code Postal</th>
            <th>Commune</th>
            <th>SIRET</th>
            <th>Site web</th>
            <th>Email</th>
            <th>Téléphone</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>

  </div>

  <script>
    let allData = [];

    function renderTable(data) {
      const tbody = document.getElementById("tbody");
      tbody.innerHTML = "";

      data.forEach(e => {
        const addr = e.adresseEtablissement || {};
        const address = `${addr.numeroVoieEtablissement || ""} ${addr.typeVoieEtablissement || ""} ${addr.libelleVoieEtablissement || ""}`.trim();

        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${e._displayName}</td>
          <td>${address}</td>
          <td>${addr.codePostalEtablissement || ""}</td>
          <td>${addr.libelleCommuneEtablissement || ""}</td>
          <td>${e.siret}</td>
          <td>
            ${
              e.website
                ? `<span class="badge-site ok">🟢 ${e.website}</span>`
                : `<span class="badge-site none">🔴 Aucun site</span>`
            }
          </td>
          <td>${e.email ? `<span class="email">${e.email}</span>` : `<span class="muted">—</span>`}</td>
          <td>${e.phone ? `<span class="phone">${e.phone}</span>` : `<span class="muted">—</span>`}</td>
        `;
        tbody.appendChild(tr);
      });
    }

    fetch("/api/dentistes")
      .then(res => res.json())
      .then(data => {
        allData = data;

        document.getElementById("loading").style.display = "none";
        document.getElementById("table").style.display = "table";

        renderTable(allData);

        const villes = [...new Set(allData.map(e =>
          e.adresseEtablissement?.libelleCommuneEtablissement
        ))].filter(Boolean).sort();

        const select = document.getElementById("ville");
        villes.forEach(v => {
          const opt = document.createElement("option");
          opt.value = v;
          opt.textContent = v;
          select.appendChild(opt);
        });

        select.addEventListener("change", () => {
          const ville = select.value;
          if (!ville) {
            renderTable(allData);
          } else {
            const filtered = allData.filter(e =>
              e.adresseEtablissement?.libelleCommuneEtablissement === ville
            );
            renderTable(filtered);
          }
        });
      });
  </script>
</body>
</html>
